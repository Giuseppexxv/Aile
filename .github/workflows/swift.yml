          cat > App/ContentView.swift <<'EOF_FILE_3'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var agent = AgentViewModel()
              @StateObject private var library = ModelLibrary()
              @State private var input = ""
              @State private var showModels = false
              @State private var showFiles = false

              private var canSend: Bool {
                  agent.isReady && !input.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty
              }

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Backdrop()
                          chat
                      }
                      .navigationTitle("Agente")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button { showFiles = true } label: { Image(systemName: "folder") }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button { showModels = true } label: { Image(systemName: "cpu") }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button { agent.reset() } label: { Image(systemName: "arrow.counterclockwise") }
                                  .disabled(agent.items.isEmpty || agent.isLoading)
                          }
                      }
                      .safeAreaInset(edge: .bottom) { inputBar }
                      .sheet(isPresented: $showModels) {
                          ModelsView(library: library, agent: agent)
                      }
                      .sheet(isPresented: $showFiles) {
                          FilesView()
                      }
                  }
              }

              // MARK: Chat

              private var chat: some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          VStack(spacing: 12) {
                              statusChip
                              if agent.items.isEmpty {
                                  emptyState
                              } else {
                                  ForEach(agent.items) { item in
                                      row(item).id(item.id)
                                  }
                              }
                          }
                          .padding()
                      }
                      .onChange(of: agent.items.last?.text) { _, _ in
                          if let last = agent.items.last {
                              proxy.scrollTo(last.id, anchor: .bottom)
                          }
                      }
                      .onChange(of: agent.items.count) { _, _ in
                          if let last = agent.items.last {
                              proxy.scrollTo(last.id, anchor: .bottom)
                          }
                      }
                  }
              }

              private var statusChip: some View {
                  VStack(spacing: 6) {
                      HStack(spacing: 8) {
                          Image(systemName: agent.isReady ? "checkmark.circle.fill" : "cpu")
                              .foregroundStyle(agent.isReady ? .green : .secondary)
                          Text(agent.shortModelName).font(.subheadline.weight(.semibold))
                          Text("·").foregroundStyle(.secondary)
                          Text(agent.status).font(.footnote).foregroundStyle(.secondary).lineLimit(2)
                      }
                      if agent.isLoading {
                          ProgressView(value: agent.downloadProgress)
                      }
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 10)
                  .glass(cornerRadius: 18)
              }

              private var emptyState: some View {
                  VStack(spacing: 14) {
                      Image(systemName: "sparkles")
                          .font(.system(size: 44))
                          .foregroundStyle(.white.opacity(0.9))
                      Text("Il tuo agente, sul tuo iPhone")
                          .font(.title3.weight(.semibold))
                      Text(agent.isReady
                           ? "Dagli un ordine, per esempio: «Crea un file todo.txt con tre cose da fare»."
                           : "Scegli un modello da Hugging Face e caricalo per cominciare.")
                          .font(.subheadline)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.center)
                      if !agent.isReady {
                          Button { showModels = true } label: {
                              Label("Scegli un modello", systemImage: "cpu")
                                  .padding(.horizontal, 8)
                          }
                          .modifier(GlassButton(prominent: true))
                      }
                  }
                  .padding(24)
                  .frame(maxWidth: .infinity)
                  .padding(.top, 40)
              }

              @ViewBuilder
              private func row(_ item: ChatItem) -> some View {
                  switch item.role {
                  case .user:
                      HStack {
                          Spacer(minLength: 48)
                          Text(item.text)
                              .textSelection(.enabled)
                              .padding(.horizontal, 14).padding(.vertical, 10)
                              .glass(cornerRadius: 20, tint: .blue)
                      }
                  case .assistant:
                      HStack {
                          Text(markdown(item.text.isEmpty ? "…" : item.text))
                              .textSelection(.enabled)
                              .padding(.horizontal, 14).padding(.vertical, 10)
                              .glass(cornerRadius: 20)
                          Spacer(minLength: 48)
                      }
                  case .tool:
                      HStack(spacing: 8) {
                          Image(systemName: item.ok ? "doc.badge.gearshape" : "exclamationmark.triangle.fill")
                              .foregroundStyle(item.ok ? Color.teal : Color.orange)
                          Text(item.text)
                              .font(.system(.footnote, design: .monospaced))
                              .lineLimit(2)
                          Spacer(minLength: 0)
                      }
                      .padding(.horizontal, 12).padding(.vertical, 8)
                      .glass(cornerRadius: 14, tint: item.ok ? .teal : .orange)
                  }
              }

              private func markdown(_ s: String) -> AttributedString {
                  let options = AttributedString.MarkdownParsingOptions(
                      interpretedSyntax: .inlineOnlyPreservingWhitespace)
                  return (try? AttributedString(markdown: s, options: options)) ?? AttributedString(s)
              }

              // MARK: Input

              private var inputBar: some View {
                  HStack(alignment: .bottom, spacing: 10) {
                      TextField("Dai un ordine all'agente…", text: $input, axis: .vertical)
                          .lineLimit(1...5)
                          .padding(.horizontal, 16).padding(.vertical, 12)
                          .glass(cornerRadius: 24, interactive: true)

                      if agent.isGenerating {
                          Button { agent.stop() } label: {
                              Image(systemName: "stop.fill").frame(width: 28, height: 28)
                          }
                          .modifier(GlassButton(prominent: true))
                          .buttonBorderShape(.circle)
                      } else {
                          Button {
                              let text = input.trimmingCharacters(in: .whitespacesAndNewlines)
                              guard !text.isEmpty else { return }
                              input = ""
                              agent.send(text)
                          } label: {
                              Image(systemName: "arrow.up").frame(width: 28, height: 28)
                          }
                          .modifier(GlassButton(prominent: true))
                          .buttonBorderShape(.circle)
                          .disabled(!canSend)
                      }
                  }
                  .padding(.horizontal)
                  .padding(.vertical, 8)
              }
          }
          EOF_FILE_3
          cat > App/FilesView.swift <<'EOF_FILE_4'
          import SwiftUI

          struct FilesView: View {
              @Environment(\.dismiss) private var dismiss
              @State private var files: [URL] = []

              var body: some View {
                  NavigationStack {
                      Group {
                          if files.isEmpty {
                              ContentUnavailableView(
                                  "Workspace vuoto",
                                  systemImage: "folder",
                                  description: Text("I file creati dall'agente compaiono qui e nell'app File, sotto Su iPhone > Agente Locale.")
                              )
                          } else {
                              List {
                                  ForEach(files, id: \.self) { url in
                                      NavigationLink(Workspace.relativePath(url)) {
                                          FileViewer(url: url)
                                      }
                                  }
                                  .onDelete { offsets in
                                      for i in offsets { try? FileManager.default.removeItem(at: files[i]) }
                                      files = Workspace.allFiles()
                                  }
                              }
                          }
                      }
                      .navigationTitle("Workspace")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Fine") { dismiss() }
                          }
                      }
                      .onAppear { files = Workspace.allFiles() }
                  }
              }
          }

          struct FileViewer: View {
              let url: URL
              @State private var text = ""

              var body: some View {
                  ScrollView {
                      Text(text)
                          .font(.system(.footnote, design: .monospaced))
                          .textSelection(.enabled)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding()
                  }
                  .navigationTitle(url.lastPathComponent)
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .topBarTrailing) {
                          ShareLink(item: url)
                      }
                  }
                  .onAppear {
                      text = (try? String(contentsOf: url, encoding: .utf8)) ?? "(file non leggibile come testo)"
                  }
              }
          }
