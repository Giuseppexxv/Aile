name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Versione Xcode
        run: xcodebuild -version

      - name: Compila llama.cpp (motore per i modelli GGUF)
        run: |
          brew install cmake || true
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin 1b70350c92563449576bcbbf552994b1d1ed847d
          git checkout FETCH_HEAD
          ./build-xcframework.sh ios-device
          cd ..
          mkdir -p Frameworks
          cp -R llama.cpp/build-apple/llama.xcframework Frameworks/
          ls Frameworks/llama.xcframework

      - name: Crea tutti i file del progetto
        run: |
          mkdir -p App Support
          cat > project.yml << 'SWIFTEOF'
          name: AgenteLocale
          options:
            bundleIdPrefix: com.giuseppe
            deploymentTarget:
              iOS: "17.0"
          packages:
            MLXSwiftLM:
              url: https://github.com/ml-explore/mlx-swift-lm
              exactVersion: 2.29.3
          targets:
            AgenteLocale:
              type: application
              platform: iOS
              sources:
                - App
              dependencies:
                - package: MLXSwiftLM
                  product: MLXLLM
                - package: MLXSwiftLM
                  product: MLXLMCommon
                - framework: Frameworks/llama.xcframework
                  embed: true
              info:
                path: Support/Info.plist
                properties:
                  CFBundleDisplayName: Agente Locale
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.giuseppe.agentelocale
                  PRODUCT_NAME: AgenteLocale
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
          SWIFTEOF
          cat > App/AgentViewModel.swift << 'SWIFTEOF'
          import SwiftUI
          import UIKit
          import MLXLLM
          import MLXLMCommon

          @MainActor
          final class AgentViewModel: ObservableObject {
              @Published var items: [ChatItem] = []
              @Published var currentModelID: String?
              @Published var loadError: String?
              @Published var downloadProgress = 0.0
              @Published var isLoading = false
              @Published var isReady = false
              @Published var isGenerating = false
              @Published var activity: String?
              @Published var pending: PendingQuestion?
              @Published var attachments: [String] = []

              let store = Store()

              private var container: ModelContainer?
              private var session: LLMSession?
              private var llamaModel: LlamaModel?
              private var task: Task<Void, Never>?
              private var continuation: CheckedContinuation<String, Never>?
              private var threadID = UUID()
              private var needsRecap = false
              private var runToken = UUID()
              private var lastHTML: String?

              init() {
                  Workspace.root = store.currentFolder
              }

              // MARK: Impostazioni lette al volo

              private var maxSteps: Int {
                  let v = UserDefaults.standard.integer(forKey: "maxSteps")
                  return v == 0 ? 12 : v
              }
              private var confirmDelete: Bool {
                  UserDefaults.standard.object(forKey: "confirmDelete") as? Bool ?? true
              }
              private var webOn: Bool { UserDefaults.standard.bool(forKey: "addon.web") }
              private var clipboardOn: Bool { UserDefaults.standard.bool(forKey: "addon.clipboard") }

              var shortModelName: String {
                  currentModelID.map { ModelInfo.displayName($0) } ?? "Scegli un modello"
              }

              // MARK: Modello

              private func makeSession() {
                  session = nil
                  let prompt = ToolParser.systemPrompt(web: webOn, clipboard: clipboardOn)
                  if let container {
                      session = MLXSessionBox(ChatSession(container, instructions: prompt))
                  } else if let llamaModel {
                      do {
                          session = try LlamaSession(model: llamaModel, system: prompt)
                      } catch {
                          loadError = error.localizedDescription
                      }
                  }
              }

              func addonsChanged() {
                  makeSession()
                  needsRecap = !items.isEmpty
              }

              func loadModel(_ id: String) async {
                  guard !isLoading else { return }
                  stop()
                  isLoading = true
                  isReady = false
                  loadError = nil
                  downloadProgress = 0
                  session = nil
                  container = nil
                  llamaModel = nil
                  currentModelID = id
                  UIApplication.shared.isIdleTimerDisabled = true
                  defer { UIApplication.shared.isIdleTimerDisabled = false }

                  do {
                      if let ref = GGUFRef(id: id) {
                          try await loadGGUF(ref)
                      } else {
                          let configuration = ModelConfiguration(id: id)
                          let loaded = try await LLMModelFactory.shared.loadContainer(
                              configuration: configuration
                          ) { progress in
                              Task { @MainActor in
                                  self.downloadProgress = progress.fractionCompleted
                              }
                          }
                          container = loaded
                      }
                      makeSession()
                      needsRecap = !items.isEmpty
                      isReady = session != nil
                      if isReady { UserDefaults.standard.set(id, forKey: "lastModel") }
                  } catch {
                      if error is LlamaError {
                          loadError = error.localizedDescription
                      } else {
                          loadError = "Non sono riuscito ad aprire questo modello: potrebbe non essere supportato dall'app. (\(error.localizedDescription))"
                      }
                  }
                  isLoading = false
              }

              private func loadGGUF(_ ref: GGUFRef) async throws {
                  let local = ref.localURL
                  if !FileManager.default.fileExists(atPath: local.path) {
                      guard let remote = ref.remoteURL else { throw LlamaError.badURL }
                      let downloader = GGUFDownloader(destination: local) { [weak self] value in
                          Task { @MainActor in self?.downloadProgress = value }
                      }
                      do {
                          try await downloader.download(from: remote)
                      } catch let e as LlamaError {
                          throw e
                      } catch {
                          throw LlamaError.download(error.localizedDescription)
                      }
                  }
                  downloadProgress = 1
                  let path = local.path
                  llamaModel = try await Task.detached(priority: .userInitiated) {
                      try LlamaModel(path: path)
                  }.value
              }

              func loadLastModelIfNeeded() async {
                  guard currentModelID == nil,
                        let id = UserDefaults.standard.string(forKey: "lastModel") else { return }
                  await loadModel(id)
              }

              // MARK: Chat e progetti

              private func saveCurrent() {
                  guard !items.isEmpty else { return }
                  let first = items.first(where: { $0.role == .user })?.text ?? "Nuova chat"
                  let title = String(first.prefix(40))
                  store.save(ChatThread(id: threadID, title: title, projectID: store.currentProjectID, items: items))
                  store.currentThreadID = threadID
              }

              private func resetChat() {
                  threadID = UUID()
                  items = []
                  needsRecap = false
                  lastHTML = nil
                  attachments = []
                  makeSession()
              }

              func newChat() {
                  stop()
                  resetChat()
              }

              func open(_ thread: ChatThread) {
                  stop()
                  if let p = store.projects.first(where: { $0.id == thread.projectID }) {
                      store.selectProject(p)
                      Workspace.root = store.currentFolder
                  }
                  threadID = thread.id
                  items = thread.items
                  needsRecap = !items.isEmpty
                  attachments = []
                  makeSession()
              }

              func selectProject(_ p: Project) {
                  stop()
                  store.selectProject(p)
                  Workspace.root = store.currentFolder
                  resetChat()
              }

              func createProject(_ name: String) {
                  let p = store.createProject(name: name)
                  selectProject(p)
              }

              func deleteProject(_ p: Project) {
                  guard store.projects.count > 1 else { return }
                  let wasCurrent = p.id == store.currentProjectID
                  if wasCurrent { stop() }
                  store.deleteProject(p)
                  if wasCurrent {
                      Workspace.root = store.currentFolder
                      resetChat()
                  }
              }

              func deleteChat(_ id: UUID) {
                  if id == threadID { stop() }
                  store.deleteThread(id)
                  if id == threadID { resetChat() }
              }

              func clearAllChats() {
                  stop()
                  store.deleteAllThreads()
                  resetChat()
              }

              // MARK: Allegati

              private func uniqueName(_ base: String) -> String {
                  let fm = FileManager.default
                  let ext = (base as NSString).pathExtension
                  let stem = (base as NSString).deletingPathExtension
                  var name = base
                  var n = 2
                  while fm.fileExists(atPath: Workspace.root.appendingPathComponent(name).path) {
                      name = ext.isEmpty ? "\(stem) \(n)" : "\(stem) \(n).\(ext)"
                      n += 1
                  }
                  return name
              }

              func attachFiles(_ urls: [URL]) {
                  for url in urls {
                      let scoped = url.startAccessingSecurityScopedResource()
                      defer { if scoped { url.stopAccessingSecurityScopedResource() } }
                      let name = uniqueName(url.lastPathComponent)
                      do {
                          try FileManager.default.copyItem(at: url, to: Workspace.root.appendingPathComponent(name))
                          attachments.append(name)
                      } catch {
                          loadError = "Non riesco ad allegare «\(url.lastPathComponent)»: \(error.localizedDescription)"
                      }
                  }
              }

              func attachPhoto(data: Data) {
                  let jpeg = UIImage(data: data)?.jpegData(compressionQuality: 0.9) ?? data
                  let name = uniqueName("foto.jpg")
                  do {
                      try jpeg.write(to: Workspace.root.appendingPathComponent(name))
                      attachments.append(name)
                  } catch {
                      loadError = "Non riesco ad allegare la foto: \(error.localizedDescription)"
                  }
              }

              func removeAttachment(_ name: String) {
                  attachments.removeAll { $0 == name }
              }

              // MARK: Domande all'utente

              private func ask(_ q: PendingQuestion) async -> String {
                  await withCheckedContinuation { (cont: CheckedContinuation<String, Never>) in
                      continuation = cont
                      pending = q
                  }
              }

              func answer(_ text: String) {
                  guard let cont = continuation else { return }
                  continuation = nil
                  pending = nil
                  items.append(ChatItem(role: .user, text: text))
                  cont.resume(returning: text)
              }

              // MARK: Invio e ciclo dell'agente

              private func recap() -> String {
                  let lines = items.suffix(12).compactMap { item -> String? in
                      switch item.role {
                      case .user: return "User: " + String(item.text.prefix(400))
                      case .assistant: return "Assistant: " + String(item.text.prefix(400))
                      case .tool: return "Action done: " + item.text
                      }
                  }
                  return "[Earlier conversation, for context only]\n" + lines.joined(separator: "\n")
                      + "\n[End of earlier conversation]\n\n"
              }

              func send(_ text: String) {
                  if pending != nil { answer(text); return }
                  guard isReady, !isGenerating, let session else { return }

                  let files = attachments
                  attachments = []
                  let recapText = needsRecap ? recap() : ""
                  needsRecap = false

                  items.append(ChatItem(role: .user, text: text, attachments: files))
                  saveCurrent()

                  var prompt = recapText + text
                  if !files.isEmpty {
                      prompt += "\n\n[The user attached these files, now in the project folder: "
                          + files.joined(separator: ", ") + ". Use read_file to look at them.]"
                  }

                  lastHTML = nil
                  runToken = UUID()
                  let token = runToken
                  isGenerating = true
                  task = Task {
                      await runAgent(session: session, firstPrompt: prompt)
                      if token == runToken {
                          activity = nil
                          isGenerating = false
                          saveCurrent()
                      }
                  }
              }

              private func runAgent(session: LLMSession, firstPrompt: String) async {
                  var prompt = firstPrompt
                  let limit = maxSteps
                  for _ in 0..<limit {
                      if Task.isCancelled { return }
                      items.append(ChatItem(role: .assistant, text: ""))
                      let index = items.count - 1
                      var full = ""
                      activity = "Sto pensando…"
                      do {
                          for try await chunk in session.streamResponse(to: prompt) {
                              if Task.isCancelled { break }
                              full += chunk
                              items[index].text = ToolParser.visibleText(full)
                              activity = ToolParser.activity(full)
                              // appena il modello chiude un comando ci fermiamo: il risultato lo diamo noi
                              if ToolParser.hasCompleteCall(full) { break }
                          }
                      } catch {
                          if !Task.isCancelled {
                              items[index].text += "\n[Errore: \(error.localizedDescription)]"
                          }
                          return
                      }
                      if Task.isCancelled { return }
                      activity = nil

                      let calls = ToolParser.parse(full)
                      let shown = items[index].text
                      if shown.isEmpty { items.remove(at: index) }

                      if calls.isEmpty {
                          if ToolParser.hasUnclosedBlock(full) {
                              items.append(ChatItem(role: .tool, text: "Il file era incompleto, riprovo", toolName: "retry", ok: false))
                              prompt = "<tool_response>\n[error] Your file block was not closed with its closing tag, so nothing was saved. Write the complete file again, from the opening tag to the closing tag.\n</tool_response>"
                              continue
                          }
                          if shown.isEmpty && lastHTML == nil {
                              items.append(ChatItem(role: .assistant, text: "Non ho ricevuto nessuna risposta dal modello. Riprova, o prova un modello diverso."))
                          }
                          if let html = lastHTML {
                              items.append(ChatItem(role: .tool, text: "Il tuo sito è pronto", toolName: "preview", previewPath: html))
                          }
                          return
                      }

                      var results: [String] = []
                      for call in calls {
                          activity = call.summary + "…"
                          let (ok, output) = await execute(call)
                          if Task.isCancelled { return }
                          if call.name != "ask_user" {
                              items.append(ChatItem(role: .tool, text: call.summary, toolName: call.name, ok: ok))
                          }
                          if ok, call.name == "write_file", let path = call.args["path"] as? String,
                             path.lowercased().hasSuffix(".html") {
                              lastHTML = path
                          }
                          results.append("[\(call.name)] \(ok ? "ok" : "error"): \(output)")
                      }
                      activity = nil
                      prompt = "<tool_response>\n" + results.joined(separator: "\n\n") + "\n</tool_response>"
                  }
                  items.append(ChatItem(role: .assistant, text: "Mi fermo qui: ho raggiunto il limite di passaggi per un singolo ordine. Puoi aumentarlo da Impostazioni, oppure scrivimi «continua»."))
                  if let html = lastHTML {
                      items.append(ChatItem(role: .tool, text: "Anteprima del sito", toolName: "preview", previewPath: html))
                  }
              }

              private func execute(_ call: ToolCall) async -> (Bool, String) {
                  switch call.name {
                  case "ask_user":
                      let q = (call.args["question"] as? String) ?? "Come vuoi procedere?"
                      let options = (call.args["options"] as? [Any])?.compactMap { $0 as? String } ?? []
                      items.append(ChatItem(role: .assistant, text: q))
                      let a = await ask(PendingQuestion(question: q, options: options))
                      return (true, "The user answered: \(a)")

                  case "delete_file":
                      if confirmDelete {
                          let path = (call.args["path"] as? String) ?? "questo file"
                          let q = "Posso eliminare «\(path)»?"
                          items.append(ChatItem(role: .assistant, text: q))
                          let a = await ask(PendingQuestion(question: q, options: ["Sì, elimina", "No"]))
                          if !a.lowercased().hasPrefix("s") {
                              return (false, "The user said no. Do not delete it.")
                          }
                      }
                      return Workspace.run(call)

                  case "fetch_url":
                      guard webOn else { return (false, "This tool is not available.") }
                      return await fetchURL((call.args["url"] as? String) ?? "")

                  case "copy_to_clipboard":
                      guard clipboardOn else { return (false, "This tool is not available.") }
                      UIPasteboard.general.string = (call.args["text"] as? String) ?? ""
                      return (true, "copied to the clipboard")

                  default:
                      return Workspace.run(call)
                  }
              }

              private func fetchURL(_ s: String) async -> (Bool, String) {
                  guard let url = URL(string: s), ["http", "https"].contains(url.scheme?.lowercased() ?? "") else {
                      return (false, "invalid URL")
                  }
                  do {
                      var req = URLRequest(url: url, timeoutInterval: 20)
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)", forHTTPHeaderField: "User-Agent")
                      let (data, _) = try await URLSession.shared.data(for: req)
                      var text = String(decoding: data, as: UTF8.self)
                      for pattern in [#"<script[\s\S]*?</script>"#, #"<style[\s\S]*?</style>"#, #"<[^>]+>"#] {
                          if let re = try? NSRegularExpression(pattern: pattern, options: [.caseInsensitive]) {
                              text = re.stringByReplacingMatches(
                                  in: text, range: NSRange(location: 0, length: (text as NSString).length),
                                  withTemplate: " ")
                          }
                      }
                      if let re = try? NSRegularExpression(pattern: #"\s+"#) {
                          text = re.stringByReplacingMatches(
                              in: text, range: NSRange(location: 0, length: (text as NSString).length),
                              withTemplate: " ")
                      }
                      let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                      return (true, String(trimmed.prefix(6000)))
                  } catch {
                      return (false, error.localizedDescription)
                  }
              }

              func stop() {
                  runToken = UUID()
                  task?.cancel()
                  task = nil
                  if let cont = continuation {
                      continuation = nil
                      cont.resume(returning: "(annullato)")
                  }
                  pending = nil
                  activity = nil
                  isGenerating = false
                  saveCurrent()
              }
          }
          SWIFTEOF
          cat > App/AgenteLocaleApp.swift << 'SWIFTEOF'
          import SwiftUI

          @main
          struct AgenteLocaleApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFTEOF
          cat > App/ContentView.swift << 'SWIFTEOF'
          import SwiftUI
          import PhotosUI
          import UniformTypeIdentifiers

          enum ActiveSheet: Identifiable {
              case models, files, projects, addons, settings
              case preview(PreviewTarget)

              var id: String {
                  switch self {
                  case .models: return "models"
                  case .files: return "files"
                  case .projects: return "projects"
                  case .addons: return "addons"
                  case .settings: return "settings"
                  case .preview(let t): return "preview-" + t.id
                  }
              }
          }

          struct ContentView: View {
              @StateObject private var agent = AgentViewModel()
              @StateObject private var library = ModelLibrary()

              @State private var input = ""
              @State private var showMenu = false
              @State private var sheet: ActiveSheet?
              @State private var showFileImporter = false
              @State private var showPhotoPicker = false
              @State private var photoItem: PhotosPickerItem?

              private let examples = [
                  "Fai un sito per la mia pizzeria",
                  "Scrivi una lista della spesa per la settimana",
                  "Leggi il PDF che ti allego e riassumilo"
              ]

              private var trimmedInput: String {
                  input.trimmingCharacters(in: .whitespacesAndNewlines)
              }

              private var canSend: Bool {
                  let hasContent = !trimmedInput.isEmpty || !agent.attachments.isEmpty
                  if agent.pending != nil { return !trimmedInput.isEmpty }
                  return hasContent && agent.isReady && !agent.isGenerating
              }

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Backdrop()
                          chat
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button { showMenu = true } label: { Image(systemName: "line.3.horizontal") }
                          }
                          ToolbarItem(placement: .principal) { modelMenu }
                      }
                      .safeAreaInset(edge: .bottom) { inputBar }
                  }
                  .overlay { drawer }
                  .sheet(item: $sheet) { s in
                      switch s {
                      case .models: ModelsView(library: library, agent: agent, onChoose: choose)
                      case .files: FilesView(store: agent.store)
                      case .projects: ProjectsView(agent: agent, store: agent.store)
                      case .addons: AddonsView(agent: agent)
                      case .settings: SettingsView(agent: agent)
                      case .preview(let target): PreviewSheet(target: target)
                      }
                  }
                  .fileImporter(isPresented: $showFileImporter, allowedContentTypes: [.item], allowsMultipleSelection: true) { result in
                      if case .success(let urls) = result { agent.attachFiles(urls) }
                  }
                  .photosPicker(isPresented: $showPhotoPicker, selection: $photoItem, matching: .images)
                  .onChange(of: photoItem) { _, item in
                      guard let item else { return }
                      Task {
                          if let data = try? await item.loadTransferable(type: Data.self) {
                              agent.attachPhoto(data: data)
                          }
                          photoItem = nil
                      }
                  }
                  .task { await agent.loadLastModelIfNeeded() }
              }

              // MARK: Scelta del modello

              private func choose(_ id: String) {
                  guard !agent.isLoading else { return }
                  if id == agent.currentModelID && agent.isReady { return }
                  let present = { Task { await agent.loadModel(id) } }
                  if sheet != nil {
                      sheet = nil
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { present() }
                  } else {
                      present()
                  }
              }

              private func menuTitle(_ id: String) -> String {
                  var title = ModelInfo.displayName(id)
                  let size = ModelInfo.sizeLabel(id)
                  if !size.isEmpty { title += " · " + size }
                  switch ModelInfo.weight(id) {
                  case .heavy, .tooHeavy: title += " ⚠︎"
                  default: break
                  }
                  return title
              }

              private var titleText: String {
                  if agent.isLoading { return "Scarico… \(Int(agent.downloadProgress * 100))%" }
                  return agent.shortModelName
              }

              private var modelMenu: some View {
                  Menu {
                      Section("I tuoi modelli") {
                          ForEach(library.saved, id: \.self) { id in
                              Button { choose(id) } label: {
                                  if id == agent.currentModelID {
                                      Label(menuTitle(id), systemImage: "checkmark")
                                  } else {
                                      Text(menuTitle(id))
                                  }
                              }
                          }
                      }
                      Divider()
                      Button { sheet = .models } label: {
                          Label("Scarica altri modelli…", systemImage: "arrow.down.circle")
                      }
                  } label: {
                      HStack(spacing: 4) {
                          Text(titleText).font(.headline).lineLimit(1)
                          Image(systemName: "chevron.down").font(.caption.weight(.bold))
                      }
                  }
              }

              // MARK: Menu laterale

              private var drawer: some View {
                  ZStack(alignment: .leading) {
                      if showMenu {
                          Color.black.opacity(0.35)
                              .ignoresSafeArea()
                              .onTapGesture { showMenu = false }
                              .transition(.opacity)
                          SideMenu(
                              store: agent.store,
                              onNewChat: { agent.newChat(); showMenu = false },
                              onOpen: { thread in agent.open(thread); showMenu = false },
                              onDelete: { id in agent.deleteChat(id) },
                              onSheet: { target in
                                  showMenu = false
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) { sheet = target }
                              }
                          )
                          .frame(width: 310)
                          .frame(maxHeight: .infinity)
                          .glass(cornerRadius: 30)
                          .padding(8)
                          .transition(.move(edge: .leading))
                          .gesture(
                              DragGesture().onEnded { value in
                                  if value.translation.width < -60 { showMenu = false }
                              }
                          )
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: showMenu)
              }

              // MARK: Chat

              private var chat: some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          VStack(spacing: 12) {
                              if agent.isLoading { loadingChip }
                              if let err = agent.loadError { errorChip(err) }
                              if agent.items.isEmpty {
                                  emptyState
                              } else {
                                  ForEach(agent.items) { item in
                                      row(item).id(item.id)
                                  }
                              }
                              if let q = agent.pending, !q.options.isEmpty { optionsView(q) }
                              if let activity = agent.activity { activityChip(activity) }
                              Color.clear.frame(height: 1).id("bottom")
                          }
                          .padding()
                      }
                      .scrollDismissesKeyboard(.interactively)
                      .onChange(of: agent.items.count) { _, _ in scrollToBottom(proxy) }
                      .onChange(of: agent.items.last?.text) { _, _ in scrollToBottom(proxy) }
                      .onChange(of: agent.activity) { _, _ in scrollToBottom(proxy) }
                      .onChange(of: agent.pending?.id) { _, _ in scrollToBottom(proxy) }
                  }
              }

              private func scrollToBottom(_ proxy: ScrollViewProxy) {
                  proxy.scrollTo("bottom", anchor: .bottom)
              }

              private var loadingChip: some View {
                  VStack(spacing: 6) {
                      Text("Preparo \(agent.shortModelName)…").font(.subheadline.weight(.semibold))
                      ProgressView(value: agent.downloadProgress)
