          import Foundation

          struct ChatItem: Identifiable, Codable {
              enum Role: String, Codable { case user, assistant, tool }
              var id = UUID()
              var role: Role
              var text: String
              var toolName: String? = nil
              var ok: Bool = true
              var previewPath: String? = nil
              var attachments: [String] = []
          }

          struct Project: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var folder: String
          }

          struct ChatThread: Identifiable, Codable {
              var id = UUID()
              var title: String
              var projectID: UUID
              var items: [ChatItem]
              var date: Date = Date()
          }

          struct PendingQuestion: Identifiable {
              let id = UUID()
              let question: String
              let options: [String]
          }

          /// Stima del peso di un modello a partire dal nome (es. "Qwen3-4B-4bit").
          enum ModelInfo {
              enum Weight { case ok, heavy, tooHeavy, unknown }

              static var deviceRAMGB: Double {
                  Double(ProcessInfo.processInfo.physicalMemory) / 1_073_741_824
              }

              static func displayName(_ id: String) -> String {
                  if let ref = GGUFRef(id: id) {
                      let name = (ref.file as NSString).lastPathComponent
                      return name.lowercased().hasSuffix(".gguf") ? String(name.dropLast(5)) : name
                  }
                  return id.split(separator: "/").last.map(String.init) ?? id
              }

              static func subtitle(_ id: String) -> String {
                  if let ref = GGUFRef(id: id) { return "GGUF · " + ref.repo }
                  return id
              }

              /// Accetta un nome MLX (proprietario/repo), un link a un file .gguf o gguf:repo:file.
              static func normalize(_ input: String) -> String? {
                  var text = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  if text.hasPrefix("gguf:") { return GGUFRef(id: text) != nil ? text : nil }
                  if let q = text.firstIndex(of: "?") { text = String(text[..<q]) }
                  if let r = text.range(of: "huggingface.co/") {
                      let parts = text[r.upperBound...].split(separator: "/").map(String.init)
                      if parts.count >= 5, parts[2] == "resolve" || parts[2] == "blob",
                         parts.last?.lowercased().hasSuffix(".gguf") == true {
                          return GGUFRef.makeID(repo: parts[0] + "/" + parts[1],
                                                file: parts[4...].joined(separator: "/"))
                      }
                      if parts.count >= 2 { text = parts[0] + "/" + parts[1] }
                  }
                  let parts = text.split(separator: "/").map(String.init)
                  if text.lowercased().hasSuffix(".gguf"), parts.count >= 3 {
                      return GGUFRef.makeID(repo: parts[0] + "/" + parts[1],
                                            file: parts[2...].joined(separator: "/"))
                  }
                  return parts.count == 2 ? text : nil
              }

              private static func ggufEstimate(_ ref: GGUFRef) -> Double? {
                  let path = ref.localURL.path
                  if let attr = try? FileManager.default.attributesOfItem(atPath: path),
                     let size = attr[.size] as? Int64, size > 0 {
                      return Double(size) / 1_073_741_824 * 1.1
                  }
                  let name = (ref.file as NSString).lastPathComponent
                  let ns = name as NSString
                  guard let re = try? NSRegularExpression(
                      pattern: #"(?<![A-Za-z0-9])(\d+(?:\.\d+)?)([BbMm])(?![A-Za-z])"#),
                        let m = re.firstMatch(in: name, range: NSRange(location: 0, length: ns.length)),
                        let number = Double(ns.substring(with: m.range(at: 1)))
                  else { return nil }
                  let billions = ns.substring(with: m.range(at: 2)).lowercased() == "b" ? number : number / 1000
                  let lower = name.lowercased()
                  var bits = 4.85
                  if lower.contains("bf16") || lower.contains("f16") { bits = 16 }
                  else if lower.contains("f32") { bits = 32 }
                  else if let qre = try? NSRegularExpression(pattern: #"q(\d)"#),
                          let qm = qre.firstMatch(in: lower, range: NSRange(location: 0, length: (lower as NSString).length)),
                          let q = Int((lower as NSString).substring(with: qm.range(at: 1))) {
                      let table: [Int: Double] = [2: 3.0, 3: 3.9, 4: 4.85, 5: 5.7, 6: 6.6, 8: 8.5]
                      bits = table[q] ?? 4.85
                  }
                  return billions * bits / 8 * 1.1
              }

              static func estimatedGB(_ id: String) -> Double? {
                  if let ref = GGUFRef(id: id) { return ggufEstimate(ref) }
                  let name = id.split(separator: "/").last.map(String.init) ?? id
                  let ns = name as NSString

                  // numero di parametri: 4B, 1.5B, 270M ...
                  guard let paramRe = try? NSRegularExpression(
                      pattern: #"(?<![A-Za-z0-9])(\d+(?:\.\d+)?)([BbMm])(?![A-Za-z])"#),
                        let m = paramRe.firstMatch(in: name, range: NSRange(location: 0, length: ns.length)),
                        let number = Double(ns.substring(with: m.range(at: 1)))
                  else { return nil }
                  let unit = ns.substring(with: m.range(at: 2)).lowercased()
                  let billions = unit == "b" ? number : number / 1000

                  // bit per peso
                  var bits = 16.0
                  let lower = name.lowercased()
                  if let bitRe = try? NSRegularExpression(pattern: #"(\d+)[-_ ]?bit"#),
                     let bm = bitRe.firstMatch(in: lower, range: NSRange(location: 0, length: (lower as NSString).length)),
                     let b = Double((lower as NSString).substring(with: bm.range(at: 1))) {
                      bits = b
                  } else if lower.contains("fp4") {
                      bits = 4
                  } else if lower.contains("fp8") {
                      bits = 8
                  }
                  return billions * bits / 8 * 1.12
              }

              static func weight(_ id: String) -> Weight {
                  guard let gb = estimatedGB(id) else { return .unknown }
                  let ram = deviceRAMGB
                  if gb > ram * 0.42 { return .tooHeavy }
                  if gb > ram * 0.28 { return .heavy }
                  return .ok
              }

              static func sizeLabel(_ id: String) -> String {
                  guard let gb = estimatedGB(id) else { return "" }
                  return String(format: "≈ %.1f GB", gb)
              }

              static func warning(_ id: String) -> String {
                  let size = sizeLabel(id)
                  let ram = String(format: "%.0f", deviceRAMGB)
                  switch weight(id) {
                  case .tooHeavy:
                      return "Questo modello (\(size)) potrebbe non funzionare su un iPhone con \(ram) GB di memoria."
                  case .heavy:
                      return "Questo modello (\(size)) potrebbe essere lento o non funzionare su un iPhone con \(ram) GB di memoria."
                  default:
                      return ""
                  }
              }
          }
