          import Foundation
          import llama
          import MLXLMCommon

          // MARK: - Interfaccia comune ai due motori (MLX e GGUF)

          protocol LLMSession: AnyObject {
              func streamResponse(to prompt: String) -> AsyncThrowingStream<String, Error>
          }

          /// Adatta la sessione MLX all'interfaccia comune.
          final class MLXSessionBox: LLMSession {
              private let inner: ChatSession
              init(_ inner: ChatSession) { self.inner = inner }

              func streamResponse(to prompt: String) -> AsyncThrowingStream<String, Error> {
                  let inner = self.inner
                  return AsyncThrowingStream { continuation in
                      let task = Task {
                          do {
                              for try await chunk in inner.streamResponse(to: prompt) {
                                  continuation.yield(chunk)
                              }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                      continuation.onTermination = { _ in task.cancel() }
                  }
              }
          }

          // MARK: - Riferimento a un file GGUF su Hugging Face

          /// Un modello GGUF si indica come  gguf:proprietario/repo:nome-file.gguf
          struct GGUFRef {
              let repo: String
              let file: String

              init?(id: String) {
                  guard id.hasPrefix("gguf:") else { return nil }
                  let rest = String(id.dropFirst(5))
                  guard let colon = rest.firstIndex(of: ":") else { return nil }
                  let r = String(rest[..<colon])
                  let f = String(rest[rest.index(after: colon)...])
                  guard r.contains("/"), !f.isEmpty else { return nil }
                  repo = r
                  file = f
              }

              static func makeID(repo: String, file: String) -> String {
                  "gguf:\(repo):\(file)"
              }

              var localURL: URL {
                  let base = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0]
                  return base
                      .appendingPathComponent("Models", isDirectory: true)
                      .appendingPathComponent(repo.replacingOccurrences(of: "/", with: "__"), isDirectory: true)
                      .appendingPathComponent(file)
              }

              var remoteURL: URL? {
                  let encoded = file.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed) ?? file
                  return URL(string: "https://huggingface.co/\(repo)/resolve/main/\(encoded)")
              }
          }

          // MARK: - Scaricamento con barra di avanzamento

          enum LlamaError: LocalizedError {
              case badURL
              case http(Int)
              case load
              case context
              case decode(Int32)
              case tooLong
              case download(String)

              var errorDescription: String? {
                  switch self {
                  case .badURL: return "Indirizzo del modello non valido."
                  case .http(let code): return "Il download è stato rifiutato (errore \(code)). Il modello potrebbe richiedere un accesso su Hugging Face."
                  case .load: return "Non riesco ad aprire il file del modello."
                  case .context: return "Non riesco a preparare la memoria di lavoro del modello."
                  case .decode(let code): return "Il modello si è fermato (codice \(code))."
                  case .download(let why): return "Il download non è riuscito (\(why)). Riprova: tieni l'app aperta e lo schermo acceso finché non finisce."
                  case .tooLong: return "La conversazione è troppo lunga per questo modello. Apri una nuova chat."
                  }
              }
          }

          final class GGUFDownloader: NSObject, URLSessionDownloadDelegate {
              private let destination: URL
              private let onProgress: (Double) -> Void
              private let lock = NSLock()
              private var continuation: CheckedContinuation<Void, Error>?
              private var session: URLSession?
              private var task: URLSessionDownloadTask?

              init(destination: URL, onProgress: @escaping (Double) -> Void) {
                  self.destination = destination
                  self.onProgress = onProgress
              }

              func download(from url: URL) async throws {
                  try await withTaskCancellationHandler {
                      try await withCheckedThrowingContinuation { (c: CheckedContinuation<Void, Error>) in
                          lock.lock()
                          continuation = c
                          let config = URLSessionConfiguration.default
                          config.timeoutIntervalForRequest = 900
                          config.timeoutIntervalForResource = 60 * 60 * 24
                          config.waitsForConnectivity = true
                          let s = URLSession(configuration: config, delegate: self, delegateQueue: nil)
                          session = s
                          let t = s.downloadTask(with: url)
                          task = t
                          lock.unlock()
                          t.resume()
                      }
                  } onCancel: {
                      self.lock.lock()
                      let t = self.task
                      self.lock.unlock()
                      t?.cancel()
                  }
              }

              private func finish(_ error: Error?) {
                  lock.lock()
                  let c = continuation
                  continuation = nil
                  let s = session
                  lock.unlock()
                  s?.finishTasksAndInvalidate()
                  guard let c else { return }
                  if let error { c.resume(throwing: error) } else { c.resume() }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  onProgress(Double(totalBytesWritten) / Double(totalBytesExpectedToWrite))
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  do {
                      if let http = downloadTask.response as? HTTPURLResponse,
                         !(200..<300).contains(http.statusCode) {
                          throw LlamaError.http(http.statusCode)
                      }
                      let fm = FileManager.default
                      try fm.createDirectory(at: destination.deletingLastPathComponent(),
                                             withIntermediateDirectories: true)
                      if fm.fileExists(atPath: destination.path) { try fm.removeItem(at: destination) }
                      try fm.moveItem(at: location, to: destination)
                      finish(nil)
                  } catch {
                      finish(error)
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  if let error { finish(error) }
              }
          }

          // MARK: - Modello llama.cpp

          final class LlamaModel: @unchecked Sendable {
              let model: OpaquePointer
              let fileName: String
              private static var backendReady = false

              init(path: String) throws {
                  if !LlamaModel.backendReady {
                      llama_backend_init()
                      LlamaModel.backendReady = true
                  }
                  var params = llama_model_default_params()
                  params.n_gpu_layers = 999
                  guard let loaded = (llama_model_load_from_file(path, params) as OpaquePointer?) else {
                      throw LlamaError.load
                  }
                  model = loaded
                  fileName = (path as NSString).lastPathComponent
              }

              deinit { llama_model_free(model) }
          }

          /// Cancellazione sicura tra thread.
          final class CancelFlag: @unchecked Sendable {
              private let lock = NSLock()
              private var value = false
              func cancel() { lock.lock(); value = true; lock.unlock() }
              var isCancelled: Bool { lock.lock(); defer { lock.unlock() }; return value }
          }

          /// Una conversazione con un modello GGUF: tiene la cronologia e riusa la memoria
          /// già calcolata, così a ogni passo dell'agente si elabora solo la parte nuova.
          final class LlamaSession: LLMSession, @unchecked Sendable {
              private let llamaModel: LlamaModel
              private let ctx: OpaquePointer
              private let vocab: OpaquePointer
              private let sampler: UnsafeMutablePointer<llama_sampler>
              private let nCtx: Int
              private let nBatch = 512
              private let template: String
              private let disableThinking: Bool
              private let lock = NSLock()
              private var messages: [(role: String, content: String)]
              private var cached: [llama_token] = []

              init(model: LlamaModel, system: String) throws {
                  llamaModel = model

                  let ram = ProcessInfo.processInfo.physicalMemory
                  var wanted = ram >= 7_500_000_000 ? 8192 : 4096
                  let trained = Int(llama_model_n_ctx_train(model.model))
                  if trained > 0 { wanted = min(wanted, trained) }
                  let ctxSize = max(1024, wanted)
                  nCtx = ctxSize

                  var cp = llama_context_default_params()
                  cp.n_ctx = UInt32(ctxSize)
                  cp.n_batch = 512
                  cp.n_ubatch = 512
                  let threads = Int32(max(2, min(6, ProcessInfo.processInfo.activeProcessorCount - 2)))
                  cp.n_threads = threads
                  cp.n_threads_batch = threads
                  guard let c = (llama_init_from_model(model.model, cp) as OpaquePointer?) else {
                      throw LlamaError.context
                  }
                  ctx = c
                  guard let v = (llama_model_get_vocab(model.model) as OpaquePointer?) else {
                      llama_free(c)
                      throw LlamaError.load
                  }
                  vocab = v

                  let chain: UnsafeMutablePointer<llama_sampler> = llama_sampler_chain_init(llama_sampler_chain_default_params())
                  llama_sampler_chain_add(chain, llama_sampler_init_top_k(40))
                  llama_sampler_chain_add(chain, llama_sampler_init_top_p(0.95, 1))
                  llama_sampler_chain_add(chain, llama_sampler_init_temp(0.6))
                  llama_sampler_chain_add(chain, llama_sampler_init_dist(UInt32.random(in: 0...UInt32.max)))
                  sampler = chain

                  let tptr: UnsafePointer<CChar>? = llama_model_chat_template(model.model, nil)
                  template = tptr.map { String(cString: $0) } ?? "chatml"

                  let lower = model.fileName.lowercased()
                  disableThinking = lower.contains("qwen3") && !lower.contains("2507") && !lower.contains("coder")

                  messages = [("system", system)]
              }

              deinit {
                  llama_sampler_free(sampler)
                  llama_free(ctx)
              }

              // MARK: Interfaccia

              func streamResponse(to prompt: String) -> AsyncThrowingStream<String, Error> {
                  AsyncThrowingStream { continuation in
                      let flag = CancelFlag()
                      continuation.onTermination = { _ in flag.cancel() }
                      DispatchQueue.global(qos: .userInitiated).async { [self] in
                          lock.lock()
                          defer { lock.unlock() }
                          do {
                              try generate(prompt, flag: flag) { _ = continuation.yield($0) }
                              continuation.finish()
                          } catch {
                              continuation.finish(throwing: error)
                          }
                      }
                  }
              }

              // MARK: Generazione

              private func generate(_ prompt: String, flag: CancelFlag, emit: (String) -> Void) throws {
                  messages.append(("user", prompt))

                  var tokens = buildTokens()
                  while tokens.count > nCtx - 768 && messages.count > 2 {
                      messages.remove(at: 1)
                      if messages.count > 2, messages[1].role == "assistant" { messages.remove(at: 1) }
                      tokens = buildTokens()
                  }
                  guard tokens.count < nCtx - 64 else { throw LlamaError.tooLong }

                  let mem = llama_get_memory(ctx)

                  // riusa la parte iniziale già elaborata
                  var common = 0
                  let limit = min(cached.count, tokens.count)
                  while common < limit && cached[common] == tokens[common] { common += 1 }
                  if common == tokens.count { common -= 1 }
                  if common < 0 { common = 0 }
                  if common < cached.count {
                      let ok = llama_memory_seq_rm(mem, 0, Int32(common), -1)
                      if ok {
                          cached.removeSubrange(common...)
                      } else {
                          llama_memory_clear(mem, true)
                          cached = []
                          common = 0
                      }
                  }

                  // elabora il testo nuovo a blocchi
                  var i = common
                  while i < tokens.count {
                      if flag.isCancelled { return }
                      let end = min(i + nBatch, tokens.count)
                      var chunk = Array(tokens[i..<end])
                      let rc: Int32 = chunk.withUnsafeMutableBufferPointer { buf in
                          llama_decode(ctx, llama_batch_get_one(buf.baseAddress, Int32(buf.count)))
                      }
                      if rc != 0 {
                          llama_memory_clear(mem, true)
                          cached = []
                          throw LlamaError.decode(rc)
                      }
                      cached.append(contentsOf: chunk)
                      i = end
                  }

                  // genera la risposta
                  var text = ""
                  var pending = Data()
                  let maxNew = min(4096, nCtx - tokens.count - 8)
                  var produced = 0
                  while produced < maxNew && cached.count < nCtx - 1 {
                      if flag.isCancelled { break }
                      var token = llama_sampler_sample(sampler, ctx, -1)
                      if llama_vocab_is_eog(vocab, token) { break }

                      pending.append(contentsOf: pieceBytes(token))
                      if let s = String(data: pending, encoding: .utf8) {
                          pending.removeAll()
                          if !s.isEmpty { text += s; emit(s) }
                      } else if pending.count > 8 {
                          let s = String(decoding: pending, as: UTF8.self)
                          pending.removeAll()
                          text += s
                          emit(s)
                      }

                      let rc: Int32 = withUnsafeMutablePointer(to: &token) { p in
                          llama_decode(ctx, llama_batch_get_one(p, 1))
                      }
                      if rc != 0 {
                          llama_memory_clear(mem, true)
                          cached = []
                          messages.append(("assistant", text))
                          throw LlamaError.decode(rc)
                      }
                      cached.append(token)
                      produced += 1

                      if ToolParser.hasCompleteCall(text) { break }
                  }
                  messages.append(("assistant", text))
              }

              // MARK: Testo e token

              private func buildTokens() -> [llama_token] {
                  var formatted = formatPrompt()
                  if disableThinking { formatted += "<think>\n\n</think>\n\n" }
                  let hasBOS = formatted.hasPrefix("<bos>") || formatted.hasPrefix("<|begin_of_text|>")
                      || formatted.hasPrefix("<s>") || formatted.hasPrefix("[gMASK]")
                  return tokenize(formatted, addSpecial: !hasBOS)
              }

              private func formatPrompt() -> String {
                  var owned: [UnsafeMutablePointer<CChar>?] = []
                  var chat: [llama_chat_message] = []
                  for m in messages {
                      let r = strdup(m.role)
                      let c = strdup(m.content)
                      owned.append(r)
                      owned.append(c)
                      chat.append(llama_chat_message(role: r, content: c))
                  }
                  defer { owned.forEach { free($0) } }

                  let total = messages.reduce(0) { $0 + $1.content.utf8.count }
                  func apply(_ tmpl: String) -> String? {
                      var buf = [CChar](repeating: 0, count: max(4096, total * 2 + 1024))
                      var n = llama_chat_apply_template(tmpl, chat, chat.count, true, &buf, Int32(buf.count))
                      if n > Int32(buf.count) {
                          buf = [CChar](repeating: 0, count: Int(n) + 1)
                          n = llama_chat_apply_template(tmpl, chat, chat.count, true, &buf, Int32(buf.count))
                      }
                      guard n > 0 else { return nil }
                      let bytes = buf[0..<Int(n)].map { UInt8(bitPattern: $0) }
                      return String(decoding: bytes, as: UTF8.self)
                  }

                  if let s = apply(template) { return s }
                  if let s = apply("chatml") { return s }
                  var out = ""
                  for m in messages { out += "<|im_start|>\(m.role)\n\(m.content)<|im_end|>\n" }
                  return out + "<|im_start|>assistant\n"
              }

              private func tokenize(_ text: String, addSpecial: Bool) -> [llama_token] {
                  let count = text.utf8.count
                  var tokens = [llama_token](repeating: 0, count: count + 16)
                  var n = llama_tokenize(vocab, text, Int32(count), &tokens, Int32(tokens.count), addSpecial, true)
                  if n < 0 {
                      tokens = [llama_token](repeating: 0, count: Int(-n))
                      n = llama_tokenize(vocab, text, Int32(count), &tokens, Int32(tokens.count), addSpecial, true)
                  }
                  return n > 0 ? Array(tokens[0..<Int(n)]) : []
              }

              private func pieceBytes(_ token: llama_token) -> [UInt8] {
                  var buf = [CChar](repeating: 0, count: 64)
                  var n = llama_token_to_piece(vocab, token, &buf, Int32(buf.count), 0, false)
                  if n < 0 {
                      buf = [CChar](repeating: 0, count: Int(-n))
                      n = llama_token_to_piece(vocab, token, &buf, Int32(buf.count), 0, false)
                  }
                  guard n > 0 else { return [] }
                  return buf[0..<Int(n)].map { UInt8(bitPattern: $0) }
              }
          }
