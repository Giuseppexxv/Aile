name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Crea i file del progetto
        run: |
          mkdir -p App Support
          cat > project.yml <<'EOF_FILE_0'
          name: AgenteLocale
          options:
            bundleIdPrefix: com.giuseppe
            deploymentTarget:
              iOS: "17.0"
          packages:
            MLXSwiftLM:
              url: https://github.com/ml-explore/mlx-swift-lm
              exactVersion: 2.29.3
          targets:
            AgenteLocale:
              type: application
              platform: iOS
              sources:
                - App
              dependencies:
                - package: MLXSwiftLM
                  product: MLXLLM
                - package: MLXSwiftLM
                  product: MLXLMCommon
              info:
                path: Support/Info.plist
                properties:
                  CFBundleDisplayName: Agente Locale
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.giuseppe.agentelocale
                  PRODUCT_NAME: AgenteLocale
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF_FILE_0
          cat > App/AgentViewModel.swift <<'EOF_FILE_1'
          import SwiftUI
          import MLXLLM
          import MLXLMCommon

          struct ChatItem: Identifiable {
              enum Role { case user, assistant, tool }
              let id = UUID()
              let role: Role
              var text: String
              var toolName: String? = nil
              var ok: Bool = true
          }

          @MainActor
          final class AgentViewModel: ObservableObject {
              @Published var items: [ChatItem] = []
              @Published var currentModelID: String?
              @Published var status = "Nessun modello caricato"
              @Published var downloadProgress = 0.0
              @Published var isLoading = false
              @Published var isReady = false
              @Published var isGenerating = false

              private var container: ModelContainer?
              private var session: ChatSession?
              private var task: Task<Void, Never>?
              private let maxSteps = 10

              var shortModelName: String {
                  currentModelID?.split(separator: "/").last.map(String.init) ?? "nessun modello"
              }

              private func makeSession(_ c: ModelContainer) -> ChatSession {
                  ChatSession(c, instructions: ToolParser.systemPrompt)
              }

              func loadModel(_ id: String) async {
                  guard !isLoading, !isGenerating else { return }
                  isLoading = true
                  isReady = false
                  downloadProgress = 0
                  session = nil
                  container = nil
                  items = []
                  currentModelID = id
                  status = "Scarico \(shortModelName)…"

                  do {
                      let configuration = ModelConfiguration(id: id)
                      let loaded = try await LLMModelFactory.shared.loadContainer(
                          configuration: configuration
                      ) { progress in
                          Task { @MainActor in
                              self.downloadProgress = progress.fractionCompleted
                          }
                      }
                      container = loaded
                      session = makeSession(loaded)
                      isReady = true
                      status = "Pronto · tutto in locale"
                  } catch {
                      status = "Errore: \(error.localizedDescription)"
                  }
                  isLoading = false
              }

              func send(_ text: String) {
                  guard let session, !isGenerating else { return }
                  items.append(ChatItem(role: .user, text: text))
                  isGenerating = true
                  task = Task {
                      await runAgent(session: session, firstPrompt: text)
                      isGenerating = false
                  }
              }

              private func runAgent(session: ChatSession, firstPrompt: String) async {
                  var prompt = firstPrompt
                  for _ in 0..<maxSteps {
                      if Task.isCancelled { return }
                      items.append(ChatItem(role: .assistant, text: ""))
                      let index = items.count - 1
                      var full = ""
                      do {
                          for try await chunk in session.streamResponse(to: prompt) {
                              full += chunk
                              items[index].text = ToolParser.visibleText(full)
                              // appena il modello chiude una chiamata, ci fermiamo: il risultato lo diamo noi
                              if full.contains("</tool_call>") { break }
                          }
                      } catch {
                          if !Task.isCancelled {
                              items[index].text += "\n[Errore: \(error.localizedDescription)]"
                          }
                          return
                      }
                      if Task.isCancelled { return }

                      let calls = ToolParser.parse(full)
                      if items[index].text.isEmpty { items.remove(at: index) }
                      if calls.isEmpty { return }

                      var results: [String] = []
                      for call in calls {
                          let (ok, output) = Workspace.run(call)
                          items.append(ChatItem(role: .tool, text: call.summary, toolName: call.name, ok: ok))
                          results.append("[\(call.name)] \(ok ? "ok" : "error"): \(output)")
                      }
                      prompt = "<tool_response>\n" + results.joined(separator: "\n\n") + "\n</tool_response>"
                  }
                  items.append(ChatItem(role: .assistant, text: "Mi fermo: ho raggiunto il limite di passaggi per un singolo ordine."))
              }

              func stop() {
                  task?.cancel()
              }

              func reset() {
                  stop()
                  items = []
                  if let container { session = makeSession(container) }
              }
          }
          EOF_FILE_1
