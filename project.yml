name: AgenteLocale
options:
  bundleIdPrefix: com.giuseppe
  deploymentTarget:
    iOS: "17.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.29.3
targets:
  AgenteLocale:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Agente Locale
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giuseppe.agentelocale
        PRODUCT_NAME: AgenteLocale
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
